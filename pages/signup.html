<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f8f3">
    <title>Sign Up | Tasty Bite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ["DM Sans", "sans-serif"], display: ["Playfair Display", "serif"] } } } };
    </script>
    <script src="../js/auth.js" defer></script>
</head>
<body class="min-h-screen bg-[#f7f8f3] font-sans text-stone-800 antialiased">
    <main class="mx-auto flex min-h-screen w-full max-w-xl items-center justify-center px-4 py-10 sm:px-6">
        <section class="w-full rounded-3xl border border-emerald-950/10 bg-white p-6 shadow-lg sm:p-9">
            <!-- The G badge carries the creator identity without adding another layout panel. -->
            <a href="login.html" class="mx-auto mb-6 grid h-14 w-14 place-items-center rounded-2xl bg-emerald-950 font-display text-3xl font-bold text-orange-300 shadow-sm" aria-label="Giri, Tasty Bite">G</a>
            <p class="text-center text-xs font-bold uppercase text-emerald-700">Tasty Bite · by Giri</p>
            <h1 class="mt-2 text-center font-display text-3xl font-bold text-emerald-950 sm:text-4xl">Create your account</h1>
            <p class="mt-3 text-center text-sm leading-6 text-stone-600">Sign up to save recipes and plan meals.</p>

            <form id="signup-form" class="mt-7 space-y-5">
                <div>
                    <label class="mb-2 block text-sm font-semibold text-emerald-950" for="signup-name">Name</label>
                    <input class="w-full rounded-xl border border-stone-300 bg-stone-50 px-4 py-3.5 outline-none transition placeholder:text-stone-400 focus:border-emerald-700 focus:bg-white focus:ring-4 focus:ring-emerald-700/10" id="signup-name" name="name" type="text" autocomplete="name" placeholder="Your name" required>
                </div>
                <div>
                    <label class="mb-2 block text-sm font-semibold text-emerald-950" for="signup-email">Email</label>
                    <input class="w-full rounded-xl border border-stone-300 bg-stone-50 px-4 py-3.5 outline-none transition placeholder:text-stone-400 focus:border-emerald-700 focus:bg-white focus:ring-4 focus:ring-emerald-700/10" id="signup-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
                </div>
                <div>
                    <label class="mb-2 block text-sm font-semibold text-emerald-950" for="signup-password">Password</label>
                    <input class="w-full rounded-xl border border-stone-300 bg-stone-50 px-4 py-3.5 outline-none transition placeholder:text-stone-400 focus:border-emerald-700 focus:bg-white focus:ring-4 focus:ring-emerald-700/10" id="signup-password" name="password" type="password" autocomplete="new-password" placeholder="Choose a password" required>
                </div>
                <p id="signup-error" class="hidden rounded-xl bg-rose-50 px-4 py-3 text-sm text-rose-800" role="alert"></p>
                <button class="w-full rounded-xl bg-emerald-900 px-5 py-3.5 font-bold text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-emerald-800 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-emerald-700 focus:ring-offset-2" type="submit">Sign up</button>
            </form>

            <p class="mt-6 text-center text-sm text-stone-600">Already signed up? <a class="font-bold text-emerald-800 hover:text-orange-600" href="login.html">Log in</a></p>
            <p class="mt-6 rounded-xl bg-amber-50 p-3 text-xs leading-5 text-amber-900">Demo only: passwords are hashed, but browser-only sign-in is not secure for real accounts.</p>
        </section>
    </main>
</body>
</html>
